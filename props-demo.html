<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Little office, big personality · Prop library</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #253b43; background: #edf1ed; }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; }
      canvas#scene { display: block; width: 100vw; height: 100vh; touch-action: none; }
      header { position: absolute; top: 20px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; pointer-events: none; }
      .intro, .controls { pointer-events: auto; }
      .eyebrow { font-size: 11px; font-weight: 750; letter-spacing: .17em; text-transform: uppercase; color: #637c75; }
      h1 { font-size: clamp(19px, 2.4vw, 30px); letter-spacing: -.045em; margin: 5px 0; font-weight: 750; }
      .sub { margin: 0; color: #60766f; font-size: 12px; }
      .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; max-width: 550px; }
      button, select { border: 1px solid #c9d5ce; color: #294940; background: #fffffff0; padding: 10px 13px; border-radius: 11px; font: 600 12px inherit; font-size: 12px; cursor: pointer; box-shadow: 0 3px 12px #203a2810; }
      button:hover, select:hover { border-color: #2c8f77; background: #fff; }
      button:focus-visible, select:focus-visible { outline: 3px solid #4aa8ff; outline-offset: 2px; }
      #day-night { background: #214e42; color: #fff; border-color: #214e42; }
      footer { position: absolute; bottom: 20px; left: 24px; right: 24px; display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; pointer-events: none; }
      .card { background: #ffffffed; padding: 12px 16px; border: 1px solid #d4ded6; border-radius: 13px; box-shadow: 0 4px 18px #26372c0c; }
      #detail { font-size: 12px; line-height: 1.6; max-width: 510px; }
      #detail strong { font-size: 14px; }
      #hint { font-size: 11px; color: #5b7269; text-align: right; line-height: 1.7; }
      body.night { color: #edf4ef; }
      body.night .eyebrow, body.night .sub { color: #b5cdc0; }
      body.night .card { background: #162b32ed; border-color: #3e585e; color: #d5e8e0; }
      body.night #hint { color: #c7ddd4; }
      @media (max-width: 700px) { header { top: 14px; left: 14px; right: 14px; flex-direction: column; gap: 10px; } .controls { justify-content: flex-start; } .sub { display: none; } footer { left: 14px; right: 14px; bottom: 14px; } #hint { display: none; } .card { padding: 9px 12px; } }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="Interactive isometric gallery of 51 low-poly office props"></canvas>
    <header>
      <div class="intro">
        <div class="eyebrow">炼丹大亨 / The little things</div>
        <h1>Little office, big personality.</h1>
        <p class="sub">51 miniature stories · shared geometry · made to be seen from above</p>
      </div>
      <div class="controls" aria-label="Gallery controls">
        <button id="day-night" type="button" aria-pressed="false">☾ Night</button>
        <button id="overview" type="button">All 51</button>
        <button id="previous" type="button" aria-label="Previous prop">←</button>
        <select id="prop" aria-label="Inspect a prop"><option value="">Inspect a prop…</option></select>
        <button id="next" type="button" aria-label="Next prop">→</button>
      </div>
    </header>
    <footer>
      <div id="detail" class="card" role="status">Building the little things…</div>
      <div id="hint" class="card">Drag to orbit · scroll to zoom · right-drag to pan<br>Choose a prop to inspect · arrow keys to browse · +Z is the front</div>
    </footer>
    <script type="module" src="/src/scene/props-demo.js"></script>
  </body>
</html>
