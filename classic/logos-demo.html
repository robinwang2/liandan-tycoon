<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>炼丹大亨 · 品牌标本</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; color: #263545; background: #f5f4ef; }
    * { box-sizing: border-box; }
    body { max-width: 1440px; margin: auto; padding: 48px 32px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; border-bottom: 1px solid #d9ddd8; padding-bottom: 30px; }
    .eyebrow, .index { font: 11px ui-monospace, monospace; letter-spacing: .16em; color: #748279; }
    h1 { font-size: clamp(28px, 4vw, 44px); letter-spacing: -.04em; margin: 12px 0; }
    p { font-size: 13px; line-height: 1.8; color: #6a756f; margin: 0; }
    a { color: #263545; text-underline-offset: 5px; font-size: 13px; white-space: nowrap; }
    .palette { display: flex; gap: 7px; margin-top: 18px; }
    .swatch { width: 19px; height: 19px; border-radius: 50%; }
    h2 { font-size: 20px; margin: 36px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
    article { background: #fff; border: 1px solid #e2e5df; border-radius: 18px; padding: 19px; }
    .specimens { display: grid; grid-template-columns: 96px 48px 24px; justify-content: space-between; align-items: center; text-align: center; gap: 10px 2px; margin: 15px 0 22px; }
    .specimens svg { display: block; margin: auto; max-width: 100%; height: auto; }
    .size { font: 10px ui-monospace, monospace; white-space: nowrap; color: #8c9690; }
    h3 { font-size: 16px; margin: 0 0 5px; }
    footer { border-top: 1px solid #d9ddd8; margin-top: 36px; padding-top: 18px; font-size: 12px; color: #748279; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 580px) { body { padding: 24px 16px; } header { align-items: start; flex-direction: column; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">LIANDAN / IDENTITY COLLECTION / 01</div><h1>愿景很大，标志很小。</h1><p>16 枚原创品牌标本 · 3 种配色 × 3 种尺寸 · 透明底 SVG</p><div class="palette" aria-label="八种品牌色"></div></div>
    <a href="/scene-demo.html">在办公室里看看 ↗</a>
  </header>
  <main id="catalog"></main>
  <footer>炼丹大亨 · 公司品牌实验室　/　动物看轮廓，菊花看结构。</footer>
  <script type="module">
    import { BRAND_COLORS, LOGOS, logoSVG } from '/src/ui/logos.js';
    document.querySelector('.palette').innerHTML = BRAND_COLORS.map(color => `<span class="swatch" style="background:${color}" title="${color}"></span>`).join('');
    const colors = BRAND_COLORS.slice(0, 3), sizes = [96, 48, 24];
    document.querySelector('#catalog').innerHTML = [
      ['sz', '01 / 深圳 · 动物合伙人', '各有本领，各有融资难题。'],
      ['bay', '02 / 湾区 · 放射状愿景', '设计师看见宇宙，网友看见菊花。'],
    ].map(([region, title, subtitle]) => `<section><h2>${title}</h2><p>${subtitle}</p><div class="grid">${LOGOS[region].map((logo, i) => `<article data-logo="${logo.id}"><div class="index">${region.toUpperCase()} / ${String(i + 1).padStart(2, '0')}</div><div class="specimens">${sizes.map(size => `<span class="size">${size} PX</span>`).join('')}${colors.map(color => sizes.map(size => logoSVG(logo.id, color, size)).join('')).join('')}</div><h3>${logo.name}</h3><p>${logo.desc}</p></article>`).join('')}</div></section>`).join('');
  </script>
</body>
</html>
