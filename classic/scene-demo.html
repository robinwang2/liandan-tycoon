<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <link rel="icon" href="data:,">
  <title>炼丹大亨 · 办公室沙盘</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-rounded, "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body, #scene { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #bfe6ff; }
    #controls {
      position: fixed; z-index: 10; left: 16px; top: 16px; width: min(292px, calc(100vw - 32px));
      max-height: calc(100vh - 32px); overflow: auto; padding: 16px;
      border: 1px solid rgba(255,255,255,.74); border-radius: 22px;
      background: rgba(255,250,239,.85); color: #26364b;
      box-shadow: 0 18px 60px rgba(40,64,86,.22), inset 0 1px 0 #fff;
      backdrop-filter: blur(15px) saturate(1.15); scrollbar-width: thin;
    }
    #controls::before { content: "炼丹大亨 · 场景实验室"; display: block; margin: 0 0 13px; font-size: 16px; font-weight: 900; letter-spacing: .04em; }
    section { padding: 10px 0; border-top: 1px solid rgba(55,75,95,.1); }
    section > label { display: flex; justify-content: space-between; margin-bottom: 7px; color: #738094; font-size: 11px; font-weight: 900; letter-spacing: .12em; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      appearance: none; border: 0; border-radius: 10px; padding: 7px 10px; background: #fff;
      color: #34445a; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(44,63,78,.1);
      transition: transform .16s ease, background .16s ease, color .16s ease;
    }
    button:hover { transform: translateY(-1px); background: #f8d887; }
    button:active { transform: translateY(1px) scale(.98); }
    button.active { color: white; background: #e27455; }
    .effects button { background: #edf4f5; }
    input[type="range"] { width: 100%; accent-color: #df724e; cursor: pointer; }
    output { color: #df724e; }
    .status { margin-top: 8px; padding: 9px 11px; border-radius: 12px; background: #293b52; color: #eaf6f4; font-size: 11px; font-weight: 700; text-align: center; }
    .hint { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); margin: 0; padding: 8px 16px; border-radius: 30px; background: #fff9e8b8; color: #405c70; font-size: 12px; pointer-events: none; white-space: nowrap; }
    body.night #controls { background: rgba(32,42,68,.93); color: #fff2d5; border-color: #78819c66; box-shadow: 0 18px 60px #11172e55; }
    body.night section > label { color: #b9c6d9; }
    body.night section { border-color: #a9bbd326; }
    body.night .hint { background: #242f50cc; color: #e3d7bc; }
    button:focus-visible { outline: 3px solid #efa64f; outline-offset: 2px; }
    @media (max-width: 760px) {
      #controls { top: 8px; left: 8px; width: calc(100vw - 16px); max-height: 42vh; padding: 12px; border-radius: 16px; }
      #controls::before { margin-bottom: 8px; } section { padding: 7px 0; }
    }
  </style>
</head>
<body>
  <main id="scene" aria-label="炼丹大亨 3D 办公室沙盘"></main>
  <aside id="controls" aria-label="场景测试控制台"></aside>
  <p class="hint">拖拽环绕 · 滚轮缩放 · 把灵感炼成下一轮融资</p>
  <script type="module" src="/src/scene/demo.js"></script>
</body>
</html>
